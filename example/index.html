<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gux</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="UI component library built with Go and WebAssembly">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Quill.js Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

    <!-- CodeMirror 6 (loaded as ES modules) -->
    <script type="module">
        import {EditorView, basicSetup} from 'https://esm.sh/@codemirror/basic-setup@0.20.0';
        import {EditorState} from 'https://esm.sh/@codemirror/state@6.4.1';
        import {javascript} from 'https://esm.sh/@codemirror/lang-javascript@6.2.2';
        import {go} from 'https://esm.sh/@codemirror/lang-go@6.0.1';
        import {html} from 'https://esm.sh/@codemirror/lang-html@6.4.9';
        import {css} from 'https://esm.sh/@codemirror/lang-css@6.3.0';
        import {json} from 'https://esm.sh/@codemirror/lang-json@6.0.1';
        import {markdown} from 'https://esm.sh/@codemirror/lang-markdown@6.3.0';
        import {sql} from 'https://esm.sh/@codemirror/lang-sql@6.8.0';
        import {python} from 'https://esm.sh/@codemirror/lang-python@6.1.6';
        import {rust} from 'https://esm.sh/@codemirror/lang-rust@6.0.1';
        import {oneDark} from 'https://esm.sh/@codemirror/theme-one-dark@6.1.2';

        window.CM = {
            EditorView,
            EditorState,
            basicSetup,
            languages: {javascript, go, html, css, json, markdown, sql, python, rust},
            themes: {oneDark}
        };
        window.dispatchEvent(new Event('codemirror-loaded'));
    </script>
</head>
<body>
    <div id="app">Loading...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
    <script src="wasm_exec.js"></script>
    <script>
        // Wait for CodeMirror to load (ES modules are async), then start WASM
        function startWasm() {
            const go = new Go();
            WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
                .then(result => go.run(result.instance));
        }

        // Check if CodeMirror is already loaded, otherwise wait for it
        if (window.CM) {
            startWasm();
        } else {
            window.addEventListener('codemirror-loaded', startWasm, { once: true });
            // Fallback: start anyway after 5 seconds if CM fails to load
            setTimeout(() => {
                if (!window.CM) {
                    console.warn('CodeMirror failed to load, starting WASM anyway');
                    startWasm();
                }
            }, 5000);
        }
    </script>
    <script>
        // Register Service Worker for PWA caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/service-worker.js');
                    console.log('[App] Service Worker registered:', registration.scope);
                } catch (error) {
                    console.error('[App] Service Worker registration failed:', error);
                }
            });
        }
    </script>
</body>
</html>
